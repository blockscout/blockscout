# Blockscout deployment for Coolify.
#
# Differences from docker-compose.yml:
#   - No nginx `proxy` service: Coolify's own reverse proxy (Traefik) terminates
#     TLS and routes each subdomain to the right container.
#   - Each public service is exposed via a Coolify "magic" FQDN variable
#     (SERVICE_FQDN_<SERVICE>_<PORT>), which makes Coolify create the route to
#     that internal port and issue a certificate.
#   - Frontend/stats are wired to the public HTTPS subdomains (the frontend runs
#     in the user's browser, so it cannot use internal container hostnames).
#
# Subdomains — overridable via BACKEND_HOST / EXPLORER_HOST / STATS_HOST /
# VISUALIZER_HOST env vars on this Coolify resource; default to the current
# production domains below, so this file needs no changes to keep working.
# Point these DNS records at the Coolify host (or your own, if overridden):
#   explorer.metrixchain.com   -> frontend  (UI)
#   backend.metrixchain.com    -> backend   (API + websocket)
#   stats.metrixchain.com      -> stats
#   visualizer.metrixchain.com -> visualizer

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  # DB is defined inline (not via services/db.yml) so it uses a named Docker
  # volume and the stock postgres user. This avoids the run-once `db-init`
  # chown container, which breaks Coolify's `docker compose up --wait`
  # ("No such container" once the init container exits). Named volumes also let
  # Coolify's "delete volumes" wipe the DB cleanly on redeploy.
  db:
    image: postgres:17
    shm_size: 256m
    restart: always
    container_name: 'db'
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      - POSTGRES_DB=blockscout
      - POSTGRES_USER=blockscout
      - POSTGRES_PASSWORD=ceWb1MeLBEeOIfk65gU8EjF8
    volumes:
      - blockscout-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    links:
      - db:database
    expose:
      - "4000"
    environment:
      # Coolify: route BACKEND_HOST -> this container's port 4000
      - SERVICE_FQDN_BACKEND_4000=https://${BACKEND_HOST:-backend.metrixchain.com}
      - BLOCKSCOUT_HOST=${BACKEND_HOST:-backend.metrixchain.com}
      - BLOCKSCOUT_PROTOCOL=https
      # Allow websocket/API calls coming from the frontend origin
      - CHECK_ORIGIN=false

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend
    expose:
      - "3000"
    environment:
      # Coolify: route EXPLORER_HOST -> this container's port 3000.
      # All NEXT_PUBLIC_* config lives in envs/common-frontend.env.
      - SERVICE_FQDN_FRONTEND_3000=https://${EXPLORER_HOST:-explorer.metrixchain.com}

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer
    expose:
      - "8050"
    environment:
      - SERVICE_FQDN_VISUALIZER_8050=https://${VISUALIZER_HOST:-visualizer.metrixchain.com}

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  # Inline (see the `db` note above): named volume + stock postgres, no init.
  stats-db:
    image: postgres:17
    shm_size: 256m
    restart: always
    container_name: 'stats-db'
    command: postgres -c 'max_connections=200'
    environment:
      - POSTGRES_DB=stats
      - POSTGRES_USER=stats
      - POSTGRES_PASSWORD=n0uejXPl61ci6ldCuE2gQU5Y
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats
    expose:
      - "8050"
    environment:
      - SERVICE_FQDN_STATS_8050=https://${STATS_HOST:-stats.metrixchain.com}
      # Reach the backend over the internal Docker network
      - STATS__BLOCKSCOUT_API_URL=http://backend:4000
      # Allow the browser (explorer subdomain) to call the stats API
      - STATS__SERVER__HTTP__CORS__ENABLED=true
      - STATS__SERVER__HTTP__CORS__ALLOWED_ORIGIN=https://${EXPLORER_HOST:-explorer.metrixchain.com}

volumes:
  blockscout-db-data:
  stats-db-data:
