# Blockscout deployment for Coolify — backend built FROM SOURCE (this repo,
# docker/Dockerfile) instead of pulled from ghcr.io/blockscout/blockscout.
#
# Why: ghcr.io/blockscout/blockscout is stuck at v9.0.2 (no publish in ~1
# year). Things this project already relies on only exist from v10.0.0+ — e.g.
# the admin auth (API_SENSITIVE_ENDPOINTS_KEY) only accepts the key via the
# x-api-key header starting v10.0.0; on v9.0.2 it's query-string-only
# (?api_key=...). HEAD of this repo is v11.2.1 (see mix.exs).
#
# This is meant to run as a SEPARATE Coolify resource/instance from the one
# using coolify.yml — same architecture, but:
#   - backend is built (docker-compose/services/backend-source-build.yml)
#     instead of pulling a prebuilt image; everything else (frontend,
#     visualizer, sig-provider, stats) still pulls prebuilt images, unchanged.
#   - No custom domains. `SERVICE_FQDN_*` below is left bare (no `=value`),
#     which tells Coolify to generate its own *.sslip.io URL for each public
#     service and wire the Traefik routing — same mechanism
#     metrix-backend/docker-compose.coolify.yml already uses for SERVICE_FQDN_METRIX_3000.
#     Nothing here needs BLOCKSCOUT_HOST or a per-service hostname var:
#       - BLOCKSCOUT_HOST only affects a few self-referential URLs in some API
#         JSON responses (config/runtime.exs) — left unset, defaults to
#         "localhost". Cosmetic only, doesn't block anything.
#       - The backend's own API CORS has no origin allowlist in prod builds
#         (BlockScoutWeb.Endpoint's @cors_plug_options only restricts origin
#         in Mix.env() == :dev) — wide open regardless of what domain the
#         frontend ends up on.
#       - The stats microservice DOES have its own CORS allowlist
#         (STATS__SERVER__HTTP__CORS__ALLOWED_ORIGIN), which needs the
#         frontend's real origin — unknowable at compose-parse time when the
#         domain is auto-generated. Set to `*` below. Stats is read-only,
#         unauthenticated aggregate chain data, so this is a low-risk
#         simplification for a non-custom-domain deploy — tighten it to the
#         actual generated frontend URL later if this becomes long-lived.
#   - DB/stats-db passwords below are placeholders for a fresh instance; if
#     this second instance is meant to serve the SAME data as production,
#     point DATABASE_URL (in envs/common-blockscout.env) at the existing DB
#     instead of standing up a new one.
#
# Once this proves out, promote it: rename to coolify.yml (replacing the
# prebuilt-image version) or merge the two, and this repo's default deploy
# path builds from source going forward.

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db
    # redis.yml doesn't define one, and plain `depends_on: - redis-db` below
    # only waits for the container to START, not for redis-server to actually
    # accept connections — harmless on coolify.yml's long-lived prod instance,
    # but a real race against a genuinely fresh redis-db on first boot here.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:17
    shm_size: 256m
    restart: always
    container_name: 'db'
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      - POSTGRES_DB=blockscout
      - POSTGRES_USER=blockscout
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a fresh password in Coolify env vars}
    volumes:
      - blockscout-db-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    depends_on:
      # Plain `depends_on: - db` (what coolify.yml uses) only waits for the
      # container to start, not for Postgres/Redis to actually accept
      # connections. backend's command runs a DB migration immediately
      # (`Explorer.ReleaseTasks.create_and_migrate()`) with no connection
      # retry of its own — on a brand-new db/redis-db booting for the first
      # time, that race loses often enough to crash-loop the whole stack.
      # Production's coolify.yml never hits this because its db has been
      # up for a long time by the point backend ever restarts.
      db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    extends:
      file: ./services/backend-source-build.yml
      service: backend
    links:
      - db:database
    expose:
      - "4000"
    environment:
      # Bare (no value): Coolify generates a *.sslip.io URL for this
      # service:port and routes it via Traefik.
      - SERVICE_FQDN_BACKEND_4000
      # Websocket/API calls come from whatever domain Coolify generated for
      # the frontend, which BLOCKSCOUT_HOST can't know ahead of time anyway.
      - CHECK_ORIGIN=false

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_FRONTEND_3000

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer
    expose:
      - "8050"
    environment:
      - SERVICE_FQDN_VISUALIZER_8050

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  stats-db:
    image: postgres:17
    shm_size: 256m
    restart: always
    container_name: 'stats-db'
    command: postgres -c 'max_connections=200'
    environment:
      - POSTGRES_DB=stats
      - POSTGRES_USER=stats
      - POSTGRES_PASSWORD=${STATS_POSTGRES_PASSWORD:?set a fresh password in Coolify env vars}
    volumes:
      - stats-db-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats
    expose:
      - "8050"
    environment:
      - SERVICE_FQDN_STATS_8050
      # Reach the backend over the internal Docker network
      - STATS__BLOCKSCOUT_API_URL=http://backend:4000
      # Frontend's real origin isn't known at compose-parse time with an
      # auto-generated domain — see the header comment.
      - STATS__SERVER__HTTP__CORS__ENABLED=true
      - STATS__SERVER__HTTP__CORS__ALLOWED_ORIGIN=*

volumes:
  # -v2: the original blockscout-db-data volume accumulated a half-migrated
  # schema from the crash-loop before the depends_on fix above (backend's
  # migration task got killed mid-run, repeatedly, before Postgres/Redis were
  # ever confirmed ready). Renaming forces Compose to create a genuinely
  # fresh, empty volume instead of reusing that corrupted one; the old
  # volume is simply orphaned, not deleted, no destructive action needed here.
  blockscout-db-data-v2:
  stats-db-data-v2:
