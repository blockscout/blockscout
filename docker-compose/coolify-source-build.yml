# Blockscout deployment for Coolify — backend built FROM SOURCE (this repo,
# docker/Dockerfile) instead of pulled from ghcr.io/blockscout/blockscout.
#
# Why: ghcr.io/blockscout/blockscout is stuck at v9.0.2 (no publish in ~1
# year). Things this project already relies on only exist from v10.0.0+ — e.g.
# the admin auth (API_SENSITIVE_ENDPOINTS_KEY) only accepts the key via the
# x-api-key header starting v10.0.0; on v9.0.2 it's query-string-only
# (?api_key=...). HEAD of this repo is v11.2.1 (see mix.exs).
#
# This is meant to run as a SEPARATE Coolify resource/instance from the one
# using coolify.yml — same architecture, but:
#   - backend is built (docker-compose/services/backend-source-build.yml)
#     instead of pulling a prebuilt image; everything else (frontend,
#     visualizer, sig-provider, stats) still pulls prebuilt images, unchanged.
#   - No custom domains. `SERVICE_FQDN_*` below is left bare (no `=value`),
#     which tells Coolify to generate its own *.sslip.io URL for each public
#     service and wire the Traefik routing — same mechanism
#     metrix-backend/docker-compose.coolify.yml already uses for SERVICE_FQDN_METRIX_3000.
#     BLOCKSCOUT_HOST is still left unset on backend — it only affects a few
#     self-referential URLs in some API JSON responses (config/runtime.exs),
#     defaults to "localhost", cosmetic only. The backend's own API CORS also
#     needs nothing here: it has no origin allowlist in prod builds
#     (BlockScoutWeb.Endpoint's @cors_plug_options only restricts origin in
#     Mix.env() == :dev), wide open regardless of the frontend's domain.
#   - envs/common-frontend.env is SHARED with production's coolify.yml, so it
#     can't hardcode this instance's domain (would break production, or vice
#     versa) — it reads BACKEND_HOST/EXPLORER_HOST/STATS_HOST/VISUALIZER_HOST
#     via Compose variable substitution instead, falling back to production's
#     metrixchain.com domains when unset. Bootstrap in two steps because
#     Coolify only generates the SERVICE_FQDN_* domains once this file is
#     first deployed — there's no way to know them ahead of time:
#       1. Deploy once with these four required vars still unset (Compose
#          will refuse — that's expected). Or, if already deployed and the
#          domains are already generated, check the application's resolved
#          domains for the exact bare hostnames.
#       2. Set BACKEND_HOST / EXPLORER_HOST / STATS_HOST / VISUALIZER_HOST in
#          this Coolify resource's env vars to those bare hostnames (no
#          scheme, no port) and redeploy.
#     For this specific already-deployed resource (uuid
#     rtga7pok9ym8rffzgjkkyldh, server 2.25.132.235), those are:
#       BACKEND_HOST=backend-rtga7pok9ym8rffzgjkkyldh.2.25.132.235.sslip.io
#       EXPLORER_HOST=frontend-rtga7pok9ym8rffzgjkkyldh.2.25.132.235.sslip.io
#       STATS_HOST=stats-rtga7pok9ym8rffzgjkkyldh.2.25.132.235.sslip.io
#       VISUALIZER_HOST=visualizer-rtga7pok9ym8rffzgjkkyldh.2.25.132.235.sslip.io
#     Also lets stats' CORS allowlist use the real frontend origin instead of
#     the `*` wildcard this file used before this was wired up.
#   - DB/stats-db passwords below are placeholders for a fresh instance; if
#     this second instance is meant to serve the SAME data as production,
#     point DATABASE_URL (in envs/common-blockscout.env) at the existing DB
#     instead of standing up a new one.
#
# Once this proves out, promote it: rename to coolify.yml (replacing the
# prebuilt-image version) or merge the two, and this repo's default deploy
# path builds from source going forward.

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db
    # redis.yml doesn't define one, and plain `depends_on: - redis-db` below
    # only waits for the container to START, not for redis-server to actually
    # accept connections — harmless on coolify.yml's long-lived prod instance,
    # but a real race against a genuinely fresh redis-db on first boot here.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:17
    shm_size: 256m
    restart: always
    container_name: 'db'
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      - POSTGRES_DB=blockscout
      - POSTGRES_USER=blockscout
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a fresh password in Coolify env vars}
    volumes:
      - blockscout-db-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    depends_on:
      # Plain `depends_on: - db` (what coolify.yml uses) only waits for the
      # container to start, not for Postgres/Redis to actually accept
      # connections. backend's command runs a DB migration immediately
      # (`Explorer.ReleaseTasks.create_and_migrate()`) with no connection
      # retry of its own — on a brand-new db/redis-db booting for the first
      # time, that race loses often enough to crash-loop the whole stack.
      # Production's coolify.yml never hits this because its db has been
      # up for a long time by the point backend ever restarts.
      db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    extends:
      file: ./services/backend-source-build.yml
      service: backend
    links:
      - db:database
    expose:
      - "4000"
    environment:
      # Bare (no value): Coolify generates a *.sslip.io URL for this
      # service:port and routes it via Traefik.
      - SERVICE_FQDN_BACKEND_4000
      # Websocket/API calls come from whatever domain Coolify generated for
      # the frontend, which BLOCKSCOUT_HOST can't know ahead of time anyway.
      - CHECK_ORIGIN=false
      # env_file (../envs/common-blockscout.env, shared with production's
      # coolify.yml) hardcodes DATABASE_URL with PRODUCTION's db password.
      # `environment:` here wins over `env_file:` for the same key, so this
      # overrides it to match whatever POSTGRES_PASSWORD this instance's own
      # `db` was actually created with — without this override, every
      # connection attempt gets rejected with FATAL 28P01 invalid_password,
      # instantly and unconditionally, regardless of db/redis readiness or
      # migration state (confirmed by reproducing the crash locally).
      - DATABASE_URL=postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_FRONTEND_3000
      # envs/common-frontend.env (shared with production) reads these via
      # Compose variable substitution to build NEXT_PUBLIC_API_HOST etc. —
      # see the file header for how to find the right values.
      - BACKEND_HOST=${BACKEND_HOST:?set BACKEND_HOST in Coolify env vars — see this file's header comment}
      - EXPLORER_HOST=${EXPLORER_HOST:?set EXPLORER_HOST in Coolify env vars — see this file's header comment}
      - STATS_HOST=${STATS_HOST:?set STATS_HOST in Coolify env vars — see this file's header comment}
      - VISUALIZER_HOST=${VISUALIZER_HOST:?set VISUALIZER_HOST in Coolify env vars — see this file's header comment}

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer
    expose:
      - "8050"
    environment:
      - SERVICE_FQDN_VISUALIZER_8050

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  stats-db:
    image: postgres:17
    shm_size: 256m
    restart: always
    container_name: 'stats-db'
    command: postgres -c 'max_connections=200'
    environment:
      - POSTGRES_DB=stats
      - POSTGRES_USER=stats
      - POSTGRES_PASSWORD=${STATS_POSTGRES_PASSWORD:?set a fresh password in Coolify env vars}
    volumes:
      - stats-db-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats
    expose:
      - "8050"
    environment:
      - SERVICE_FQDN_STATS_8050
      # Reach the backend over the internal Docker network
      - STATS__BLOCKSCOUT_API_URL=http://backend:4000
      # services/stats.yml's own defaults hardcode PRODUCTION's db/stats-db
      # passwords (same class of bug as backend's DATABASE_URL above) —
      # override both to match this instance's own required passwords.
      - STATS__DB_URL=postgres://stats:${STATS_POSTGRES_PASSWORD}@stats-db:5432/stats
      - STATS__BLOCKSCOUT_DB_URL=postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout
      - STATS__SERVER__HTTP__CORS__ENABLED=true
      - STATS__SERVER__HTTP__CORS__ALLOWED_ORIGIN=https://${EXPLORER_HOST:?set EXPLORER_HOST in Coolify env vars — see this file's header comment}

volumes:
  # -v2: the original blockscout-db-data volume accumulated a half-migrated
  # schema from the crash-loop before the depends_on fix above (backend's
  # migration task got killed mid-run, repeatedly, before Postgres/Redis were
  # ever confirmed ready). Renaming forces Compose to create a genuinely
  # fresh, empty volume instead of reusing that corrupted one; the old
  # volume is simply orphaned, not deleted, no destructive action needed here.
  blockscout-db-data-v2:
  stats-db-data-v2:
